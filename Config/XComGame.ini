[ClassHighlander.X2DownloadableContentInfo_ClassHighlander]
DLCIdentifier="ClassHighlander"

; LW_FactionBalance overwrites Reward_ExtraFactionSoldier.IsRewardAvailableFn in its own
; OnPostTemplatesCreated without chaining the previous delegate. Mod run order for
; OnPostTemplatesCreated is not guaranteed by the engine, so without this directive
; LW_FactionBalance could run after us and silently discard our duplicate-class guard
; (PatchFactionHeroRewardAvailability in X2DownloadableContentInfo_ClassHighlander.uc).
; RunAfter is a no-op if LW_FactionBalance is not installed.
[ClassHighlander CHDLCRunOrder]
+RunAfter=LW_FactionBalance